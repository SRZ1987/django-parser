<div class="shopping-list-actions" aria-label="Отправить план покупок">
    <a class="list-action-button" href="{{ email_share_url }}">Email</a>
    <button class="list-action-button" type="button" data-share-plan data-share-url="{{ shared_url }}">Поделиться</button>
    <button class="list-action-button" type="button" data-copy-plan data-share-url="{{ shared_url }}">Скопировать ссылку</button>
    <a class="list-action-button list-action-primary" href="{{ print_url }}" target="_blank" rel="noopener">Печать / PDF</a>
    <span class="share-action-status" role="status" aria-live="polite" data-share-status></span>
</div>
