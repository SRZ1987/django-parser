<div class="shopping-list-actions" aria-label="Отправить план покупок">
    <a class="list-action-button" href="{{ email_share_url }}">Email</a>
    <details class="messenger-share-menu">
        <summary class="list-action-button">Мессенджеры</summary>
        <div class="messenger-share-links" aria-label="Выберите мессенджер">
            {% for messenger in messenger_share_links %}
                <a class="messenger-share-link"
                   href="{{ messenger.url }}"
                   {% if messenger.opens_new_tab %}target="_blank" rel="noopener noreferrer"{% endif %}>
                    {{ messenger.name }}
                </a>
            {% endfor %}
        </div>
    </details>
    <button class="list-action-button" type="button" data-share-plan data-share-url="{{ shared_url }}">Поделиться</button>
    <button class="list-action-button" type="button" data-copy-plan data-share-url="{{ shared_url }}">Скопировать ссылку</button>
    <a class="list-action-button list-action-primary" href="{{ print_url }}" target="_blank" rel="noopener">Печать / PDF</a>
    {% if editable %}
        <form class="shopping-list-clear-form" method="post" action="{% url 'clear_shopping_list' %}" data-clear-list-form>
            {% csrf_token %}
            <button class="list-action-button list-action-danger" type="submit">Удалить весь список</button>
        </form>
    {% endif %}
    <span class="share-action-status" role="status" aria-live="polite" data-share-status></span>
</div>
