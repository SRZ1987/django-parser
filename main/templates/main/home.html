{% extends 'main/base.html' %}
{% load i18n %}

{% block title %}{% translate "Product search" %} — Tannenberg{% endblock %}

{% block content %}
<main>
    <section class="hero-section simple-hero search-workspace" aria-labelledby="page-title">
        <div class="hero-content">
            <h1 id="page-title">{% translate "Product search" %}</h1>

            <form class="search-panel" method="get" action="{% url 'product_search' %}" role="search" data-search-form data-barcode-search-form>
                <label class="visually-hidden" for="search-input">{% translate "Search for a product" %}</label>
                <div class="search-input-wrap">
                    <input
                        id="search-input"
                        name="q"
                        type="search"
                        value="{{ query }}"
                        placeholder="{% translate 'Product name, SKU or barcode' %}"
                        autocomplete="off"
                        aria-autocomplete="list"
                        aria-controls="search-suggestions"
                        aria-expanded="false"
                        data-suggestions-input
                        data-suggestions-url="{% url 'search_suggestions' %}"
                        data-barcode-search-input
                    >
                    <div
                        id="search-suggestions"
                        class="suggestions-panel"
                        role="listbox"
                        aria-label="{% translate 'Product suggestions' %}"
                        data-suggestions-panel
                        data-no-image="{% translate 'No image' %}"
                        data-price-unavailable="{% translate 'Price not specified' %}"
                        hidden
                    ></div>
                </div>
                {% include "main/includes/barcode_scan_button.html" %}
                <button class="search-submit search-submit-text" type="submit">{% translate "Search" %}</button>
            </form>
        </div>
    </section>
</main>
{% endblock %}
