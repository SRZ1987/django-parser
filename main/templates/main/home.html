{% extends 'main/base.html' %}

{% block title %}Price Compare{% endblock %}

{% block content %}
<main>
    <section class="hero-section simple-hero" aria-labelledby="page-title">
        <div class="hero-content">
            <p class="hero-kicker">Сравнение цен между магазинами</p>
            <h1 id="page-title">Найдите товар и выберите, где купить дешевле</h1>
            <p class="hero-description">
                Найдите товар, добавьте его в список — мы покажем, где купить дешевле после каждого обновления каталога.
            </p>

            <form class="search-panel" method="get" action="{% url 'product_search' %}" role="search" data-search-form>
                <label class="visually-hidden" for="search-input">Поиск товара</label>
                <div class="search-input-wrap">
                    <input
                        id="search-input"
                        name="q"
                        type="search"
                        value="{{ query }}"
                        placeholder="Название товара, SKU или штрихкод"
                        autocomplete="off"
                        aria-autocomplete="list"
                        aria-controls="search-suggestions"
                        aria-expanded="false"
                        data-suggestions-input
                        data-suggestions-url="{% url 'search_suggestions' %}"
                    >
                    <div
                        id="search-suggestions"
                        class="suggestions-panel"
                        role="listbox"
                        aria-label="Подсказки товаров"
                        data-suggestions-panel
                        hidden
                    ></div>
                </div>
                <button class="search-submit search-submit-text" type="submit">Найти</button>
            </form>
        </div>
    </section>
</main>
{% endblock %}
