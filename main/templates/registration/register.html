{% extends 'main/base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<main class="page-shell auth-shell">
    <section class="auth-card">
        <p class="eyebrow">Новый аккаунт</p>
        <h1>Регистрация</h1>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {{ form.non_field_errors }}
            <label>
                <span>Имя пользователя</span>
                {{ form.username }}
                {{ form.username.errors }}
            </label>
            <label>
                <span>Email</span>
                {{ form.email }}
                {{ form.email.errors }}
            </label>
            <label>
                <span>Пароль</span>
                {{ form.password1 }}
                {{ form.password1.errors }}
            </label>
            <label>
                <span>Повторите пароль</span>
                {{ form.password2 }}
                {{ form.password2.errors }}
            </label>
            <button type="submit">Создать аккаунт</button>
        </form>
        <p class="auth-note">После регистрации мы отправим ссылку для подтверждения email.</p>
        <p class="auth-note">Уже есть аккаунт? <a href="{% url 'login' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Войти</a></p>
    </section>
</main>
{% endblock %}
