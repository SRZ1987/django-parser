{% extends 'main/base.html' %}
{% load i18n %}

{% block title %}{% translate "Resend confirmation" %} — Tannenberg{% endblock %}

{% block content %}
<main class="page-shell auth-shell">
    <section class="auth-card">
        <p class="eyebrow">{% translate "Email confirmation" %}</p>
        <h1>{% translate "Send the email again" %}</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <label>
                <span>Email</span>
                {{ form.email }}
                {{ form.email.errors }}
            </label>
            <button type="submit">{% translate "Send" %}</button>
        </form>
    </section>
</main>
{% endblock %}
