{% extends 'main/base.html' %}
{% load i18n %}

{% block title %}{% translate "Log in" %}{% endblock %}

{% block content %}
<main class="page-shell auth-shell">
    <section class="auth-card">
        <p class="eyebrow">{% translate "Account" %}</p>
        <h1>{% translate "Log in" %}</h1>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {{ form.non_field_errors }}
            <label>
                <span>{% translate "Username" %}</span>
                {{ form.username }}
                {{ form.username.errors }}
            </label>
            <label>
                <span>{% translate "Password" %}</span>
                {{ form.password }}
                {{ form.password.errors }}
            </label>
            <button type="submit">{% translate "Log in" %}</button>
        </form>
        <p class="auth-note">{% translate "No account?" %} <a href="{% url 'register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">{% translate "Register" %}</a></p>
    </section>
</main>
{% endblock %}
